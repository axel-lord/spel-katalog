spel-katalog-sink = { path = "crates/spel-katalog/crates/sink" }
spel-katalog-tag-filter = { path = "crates/spel-katalog/crates/tag-filter" }
spel-katalog-terminal = { path = "crates/spel-katalog/crates/terminal" }
spel-katalog-widget = { path = "crates/spel-katalog-widget" }
strsim = "0.11.1"
strum = "0.28.0"
syn = { version = "2.0.118", default-features = false, features = ["full", "parsing", "printing"] }
tabled = { version = "0.21.0", default-features = false }

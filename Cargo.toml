[workspace]
members = [
	"crates/spel-katalog",
	"crates/spel-katalog-api",
	"crates/spel-katalog-assets",
	"crates/spel-katalog-cache-queue",
	"crates/spel-katalog-color",
	"crates/spel-katalog-common",
	"crates/spel-katalog-daemon",
	"crates/spel-katalog-enthread", 
	"crates/spel-katalog-fold-with",
	"crates/spel-katalog-formats",
	"crates/spel-katalog-install",
	"crates/spel-katalog-ipc",
	"crates/spel-katalog-lazy",
	"crates/spel-katalog-log",
	"crates/spel-katalog-log/crates/view",
	"crates/spel-katalog-profiler",
	"crates/spel-katalog-widget",
	"crates/spel-katalog-widget/crates/list-menu",
	"crates/spel-katalog/crates/cli",
	"crates/spel-katalog/crates/games",
	"crates/spel-katalog/crates/gather",
	"crates/spel-katalog/crates/info",
	"crates/spel-katalog/crates/installer",
	"crates/spel-katalog/crates/native",
	"crates/spel-katalog/crates/process-view",
	"crates/spel-katalog/crates/run",
	"crates/spel-katalog/crates/settings/crates/build",
	"crates/spel-katalog/crates/settings/crates/derive",
	"crates/spel-katalog/crates/settings/crates/derive-lib",
	"crates/spel-katalog/crates/settings/crates/traits",
	"crates/spel-katalog/crates/settings/crates/view",
	"crates/spel-katalog/crates/sink",
	"crates/spel-katalog/crates/tag-filter", 
	"crates/spel-katalog/crates/terminal",
	"test",
]
resolver = "2"
default-members = ["crates/spel-katalog"]

[workspace.package]
edition = "2024"
authors = ["Axel Lord"]
license = "MIT OR Apache-2.0"

[profile.release]
strip = "debuginfo"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
case_sensitive_file_extension_comparisons = "warn"
dbg_macro = "warn"
future_not_send = "warn"
missing_const_for_fn = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
print_stderr = "warn"
print_stdout = "warn"
std_instead_of_core = "warn"
str_to_string = "warn"
todo = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
bon = "3.9.3"
bytemuck = "1.25.0"
bytes = "1.12.0"
chrono = { version = "0.4.45", default-features = false }
clap = "4.6.1"
clap_complete = "4.6.5"
color-eyre = "0.6.5"
convert_case = "0.11.0"
dashmap = "6.2.1"
derive-new = "0.7.0"
derive_more = "2.1.1"
either = "1.16.0"
env_logger = "0.11.11"
flate2 = "1.1.9"
flume = "0.12.0"
futures = "0.3.32"
http-body-util = "0.1.3"
hyper = "1.10.1"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "crisp", "wayland", "smol"] }
iced_aw = { version = "0.14.1", default-features = false }
iced_core = "0.14.0"
iced_futures = { version = "0.14.0", features = ["smol"] }
iced_highlighter = "0.14.0"
iced_renderer = { version = "0.14.0", features = ["wgpu"] }
iced_runtime = "0.14.0"
iced_widget = { version = "0.14.2", features = ["image", "lazy"] }
iced_winit = { version = "0.14.0", default-features = false, features = ["wayland"] }
image = { version = "0.25.10", features = ["rayon", "default-formats"] }
indexmap = "2.14.0"
itertools = "0.15.0"
log = "0.4.33"
memchr = "2.8.2"
mimalloc = "0.1.52"
nalgebra = "0.35.0"
once_cell = "1.21.4"
open = "5.3.5"
parking_lot = "0.12.5"
paste = "1.0.15"
pin-project = "1.1.13"
pretty_assertions = "1.4.1"
prettyplease = "0.2.37"
proc-macro2 = { version = "1.0.106", default-features = false }
quote = { version = "1.0.46", default-features = false }
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"
rand = "0.10.1"
rayon = "1.12.0"
regex = "1.12.4"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"]}
rusqlite = "0.39.0"
rustc-hash = "2.1.2"
rustix = "1.1.4"
serde = "1.0.228"
serde_bytes = "0.11.19"
serde_json = "1.0.150"
shell-words = "1.1.1"
smallvec = "1.15.2"
smol = "2.0.2"
smol-hyper = "0.1.1"
spel-katalog-cli = { path = "crates/spel-katalog/crates/cli" }
spel-katalog-common = { path = "crates/spel-katalog-common" }
spel-katalog-formats = { path = "crates/spel-katalog-formats" }
spel-katalog-games = { path = "crates/spel-katalog/crates/games" }
spel-katalog-gather = { path = "crates/spel-katalog/crates/gather" }
spel-katalog-info = { path = "crates/spel-katalog/crates/info" }
spel-katalog-install = { path = "crates/spel-katalog-install" }
spel-katalog-installer = { path = "crates/spel-katalog/crates/installer" }
spel-katalog-ipc = { path = "crates/spel-katalog-ipc" }
spel-katalog-lazy = { path = "crates/spel-katalog-lazy" }
spel-katalog-log = { path = "crates/spel-katalog-log" }
